<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc"><title id="title">VedAstro for WordPress</title><desc id="desc">Bring a little cosmos to your corner of the web. Panchanga, planets and predictions, with a shortcode.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171b38"/><stop offset="1" stop-color="#3d2869"/></linearGradient><linearGradient id="orbit"><stop stop-color="#b5a4ff"/><stop offset="1" stop-color="#78dfce"/></linearGradient></defs><rect width="1280" height="440" rx="28" fill="url(#bg)"/><g fill="#eeeaff" opacity=".55"><circle cx="760" cy="68" r="2"/><circle cx="1190" cy="80" r="3"/><circle cx="1150" cy="368" r="2"/><circle cx="810" cy="352" r="3"/><circle cx="710" cy="265" r="2"/></g><g transform="translate(996 220)" fill="none" stroke="url(#orbit)"><circle r="150" opacity=".2"/><circle r="112" opacity=".3"/><ellipse rx="180" ry="65" transform="rotate(-28)" opacity=".6"/><circle r="68" opacity=".6"/></g><circle cx="996" cy="220" r="51" fill="#ffffff"/><text x="996" y="239" text-anchor="middle" font-size="61" font-family="Georgia,serif" fill="#43316e">W</text><circle cx="1101" cy="153" r="13" fill="#87e5ce"/><circle cx="859" cy="280" r="8" fill="#c7baff"/><circle cx="1012" cy="70" r="6" fill="#e5cc86"/><rect x="64" y="57" width="218" height="34" rx="17" fill="#ffffff" opacity=".1"/><text x="84" y="79" fill="#cfc4ff" font-size="13" font-family="Arial,sans-serif" letter-spacing="2">A LITTLE MORE COSMOS</text><text x="64" y="167" fill="white" font-size="54" font-weight="700" font-family="Arial,sans-serif">VedAstro for WordPress</text><text x="64" y="222" fill="#c7c2e2" font-size="25" font-family="Arial,sans-serif">Your website. A whole new sky.</text><text x="64" y="286" fill="#d8d5e8" font-size="19" font-family="Arial,sans-serif">Birth charts. Ashtakavarga. Panchanga.</text><text x="64" y="316" fill="#d8d5e8" font-size="19" font-family="Arial,sans-serif">Add a shortcode. Share the cosmos.</text><rect x="64" y="355" width="186" height="35" rx="17" fill="#84e1ca"/><text x="157" y="378" text-anchor="middle" fill="#183b37" font-size="14" font-weight="700" font-family="Arial,sans-serif">Free &amp; open source</text></svg>